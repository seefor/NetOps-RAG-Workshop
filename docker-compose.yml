services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  app:
    build: .
    depends_on:
      - ollama
    ports:
      - "8501:8501"
    volumes:
      - ./.chroma:/app/.chroma
      - ./data:/app/data
      - ./prompts:/app/prompts
    environment:
      LLM_PROVIDER: ollama
      EMBEDDINGS_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: llama3.2
      OLLAMA_EMBED_MODEL: embeddinggemma
      CHROMA_PATH: .chroma
      COLLECTION_NAME: netops_knowledge
      TOP_K: 5
      TEMPERATURE: 0.1

volumes:
  ollama:
