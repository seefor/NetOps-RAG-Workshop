name: Python checks

on:
  push:
  pull_request:

jobs:
  syntax-and-unit:
    strategy:
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m compileall src tests scripts streamlit_app.py
      - run: python -m unittest discover -s tests -v

  hermes-bonus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[hermes]'
      - run: python -m unittest discover -s bonus/hermes-netops-copilot/tests -v
      - run: python bonus/hermes-netops-copilot/scripts/test_mcp_protocol.py
