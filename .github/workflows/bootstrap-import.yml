name: Bootstrap workshop import

on:
  push:
    branches: [main]
    paths:
      - 'IMPORT_READY'

permissions:
  contents: write

jobs:
  import-workshop:
    if: github.event.head_commit.message != 'Import NetOps RAG Workshop v8.2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and unpack workshop
        shell: bash
        run: |
          set -euo pipefail
          cat workshop_v8_2_zip.part*.b64 | base64 --decode > /tmp/workshop-v8.2.zip
          rm -rf /tmp/workshop-v8.2
          mkdir -p /tmp/workshop-v8.2
          unzip -q /tmp/workshop-v8.2.zip -d /tmp/workshop-v8.2
          SOURCE_DIR="$(find /tmp/workshop-v8.2 -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SOURCE_DIR"
          rsync -a "$SOURCE_DIR/" ./
          rm -f workshop_v8_2_zip.part*.b64 IMPORT_READY
          rm -f .github/workflows/bootstrap-import.yml

      - name: Commit imported workshop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import NetOps RAG Workshop v8.2"
          git push origin HEAD:main
