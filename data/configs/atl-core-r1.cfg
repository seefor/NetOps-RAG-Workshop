---
device_name: atl-core-r1
site: atlanta-dc
role: core
vendor: cisco
platform: ios-xe
service: bgp
status: active
environment: production
source_authority: device_snapshot
snapshot_date: 2026-07-28
---
hostname atl-core-r1
!
interface Loopback0
 description ROUTER-ID
 ip address 10.255.0.1 255.255.255.255
!
interface GigabitEthernet0/0
 description P2P_TO_ATL-CORE-R2
 ip address 10.0.0.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description TRANSIT_TO_NYC-EDGE-R1
 ip address 198.51.100.1 255.255.255.252
 no shutdown
!
router ospf 100
 router-id 10.255.0.1
 passive-interface default
 no passive-interface GigabitEthernet0/0
 network 10.0.0.0 0.0.0.3 area 0
!
router bgp 65001
 bgp log-neighbor-changes
 neighbor 198.51.100.2 remote-as 65020
 neighbor 198.51.100.2 description NYC-EDGE-R1
 neighbor 198.51.100.2 update-source GigabitEthernet0/1
 address-family ipv4
  neighbor 198.51.100.2 activate
  neighbor 198.51.100.2 route-map RM-NYC-IN in
 exit-address-family
!
route-map RM-NYC-IN permit 10
 match ip address prefix-list PL-NYC-IN
!
ip prefix-list PL-NYC-IN seq 5 permit 10.20.0.0/16 le 24
!
ntp server 192.0.2.20 prefer
ntp server 192.0.2.21
ip ssh version 2
logging host 192.0.2.30
