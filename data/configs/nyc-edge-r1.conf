---
device_name: nyc-edge-r1
site: new-york-dc
role: edge
vendor: juniper
platform: junos
service: bgp
status: active
environment: production
source_authority: device_snapshot
snapshot_date: 2026-07-28
---
system {
    host-name nyc-edge-r1;
    services { ssh; }
    ntp { server 192.0.2.20; }
}
interfaces {
    ge-0/0/0 {
        description "TRANSIT_TO_ATL-CORE-R1";
        unit 0 { family inet { address 198.51.100.2/30; } }
    }
    lo0 { unit 0 { family inet { address 10.255.20.1/32; } } }
}
policy-options {
    prefix-list ATL-IN { 10.10.0.0/16; }
    policy-statement IMPORT-ATL {
        term approved { from prefix-list ATL-IN; then accept; }
        then reject;
    }
}
protocols {
    bgp {
        group ATLANTA {
            type external;
            peer-as 65001;
            import IMPORT-ATL;
            neighbor 198.51.100.1;
        }
    }
}
