---
device_name: atl-dist-sw1
site: atlanta-dc
role: distribution
vendor: cisco
platform: ios-xe
service: switching
status: active
environment: production
source_authority: device_snapshot
snapshot_date: 2026-07-28
---
hostname atl-dist-sw1
!
vlan 110
 name USERS
vlan 120
 name VOICE
vlan 130
 name SERVERS
!
interface GigabitEthernet1/0/47
 description UPLINK_TO_ATL-ACCESS-SW1
 switchport trunk allowed vlan 110,120
 switchport mode trunk
 spanning-tree guard root
!
interface GigabitEthernet1/0/48
 description UPLINK_TO_ATL-CORE-R2
 no switchport
 ip address 10.0.10.2 255.255.255.252
 ip ospf 100 area 0
!
interface Vlan110
 ip address 10.10.110.1 255.255.255.0
 standby 110 ip 10.10.110.254
 standby 110 priority 110
 standby 110 preempt
!
interface Vlan120
 ip address 10.10.120.1 255.255.255.0
 standby 120 ip 10.10.120.254
!
spanning-tree mode rapid-pvst
spanning-tree vlan 110,120,130 priority 24576
